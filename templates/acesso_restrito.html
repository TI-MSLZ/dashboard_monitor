<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{{ url_for('static', filename='professional-theme.css') }}?v=1">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-logo">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="São Luiz">
                </div>
            </div>

            <nav class="sidebar-menu">
                {% include 'sidebar.html' %}
            </nav>
        </aside>

        <main class="main-content acesso-restrito-main">
            <section class="acesso-restrito-card">
                <img class="acesso-restrito-img" src="{{ url_for('static', filename='acesso_restrito.png') }}" alt="Acesso restrito">
                <a class="acesso-restrito-btn" href="{{ url_for('home') }}">
                    <i class="fa-solid fa-house"></i>
                    Voltar para o início
                </a>
            </section>
        </main>
    </div>
</body>
</html>
